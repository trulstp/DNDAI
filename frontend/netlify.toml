# Build with the same Node version as .nvmrc in the repo root
[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/"
  status = 200

# Files under /assets have a content hash in their name, so a changed file gets a new name.
# Browsers can keep them for a year without checking back on each visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"