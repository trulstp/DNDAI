# Checks every pull request, and main after each merge: backend tests, the frontend build,
# and the Docker image that Render deploys
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch replaces a run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check for vulnerable dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://supportroll-api.onrender.com

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t supportroll-backend backend
      - name: Start it and check /health
        run: |
          # The OpenAI client needs a key to start; nothing here calls OpenAI
          docker run -d --name backend -p 4000:4000 -e OPENAI_API_KEY=ci-placeholder supportroll-backend
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then exit 0; fi
            sleep 1
          done
          docker logs backend
          exit 1
